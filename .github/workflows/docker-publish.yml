name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image name (lowercase)
        id: image
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          IMG="${IMG,,}"
          echo "name=${IMG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Redeploy Webhook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' || secrets.RENDER_DEPLOY_HOOK != '' || secrets.RENDER_WEBHOOK_URL != '' || secrets.RENDER_WEBHOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK || secrets.RENDER_WEBHOOK_URL || secrets.RENDER_WEBHOOK }}
        run: |
          echo "Disparando despliegue automático en Render vía Webhook Deploy Hook..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${RENDER_DEPLOY_HOOK}")
          http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS")
          echo "Respuesta de Render: $body"
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Despliegue disparado exitosamente en Render (HTTP $http_code)."
          else
            echo "Error o respuesta inesperada al invocar Deploy Hook de Render (HTTP $http_code)."
            exit 1
          fi
